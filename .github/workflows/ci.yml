name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DATABASE_URL: postgresql+asyncpg://holdem:holdem-ci@127.0.0.1:5432/holdem_ci
  APP_ENV: test
  APP_SECRET_KEY: dGVzdC1vbmx5LWhvbGRlbS1zZWNyZXQta2V5LTAwMDEyMzQ1Njc4OQ
  ALLOWED_ORIGINS: http://127.0.0.1:5173
  COOKIE_SECURE: "false"
  AUTO_CREATE_SCHEMA: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: holdem_ci
          POSTGRES_USER: holdem
          POSTGRES_PASSWORD: holdem-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holdem -d holdem_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install server dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "./apps/server[dev]"
      - name: Apply migrations
        run: python -m alembic -c apps/server/alembic.ini upgrade head
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Verify generated contracts
        run: pnpm contracts:generate && git diff --exit-code -- contracts/protocol.schema.json contracts/shuffle-v1-vectors.json apps/web/src/generated/protocol.ts
      - name: Build web app
        run: pnpm build
      - name: Check load harness syntax
        run: node --check tests/load/load.mjs

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - mobile-chromium
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: holdem_ci
          POSTGRES_USER: holdem
          POSTGRES_PASSWORD: holdem-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holdem -d holdem_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && python -m pip install -e "./apps/server[dev]"
      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.project == 'mobile-chromium' && 'chromium' || matrix.project }}
      - name: Run end-to-end tests
        run: pnpm exec playwright test --project=${{ matrix.project }}
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  images:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build combined application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.app
          push: false
          cache-from: type=gha,scope=j-poker-app
          cache-to: type=gha,mode=max,scope=j-poker-app

  load-smoke:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: holdem_ci
          POSTGRES_USER: holdem
          POSTGRES_PASSWORD: holdem-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holdem -d holdem_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && python -m pip install -e "./apps/server[dev]"
      - name: Start server
        run: |
          python -m alembic -c apps/server/alembic.ini upgrade head
          python -m uvicorn app.main:socket_app --app-dir apps/server --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Run load smoke test
        env:
          LOAD_ROOMS: "2"
          LOAD_USERS_PER_ROOM: "2"
          LOAD_ORIGIN: "http://127.0.0.1:5173"
          LOAD_DURATION_SECONDS: "15"
          LOAD_RAMP_CONCURRENCY: "2"
          LOAD_MAX_P95_MS: "1000"
        run: pnpm --filter @holdem/load-tests load
