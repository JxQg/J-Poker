[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "private-holdem-server"
version = "0.1.0"
description = "Authoritative room server for the private Hold'em MVP"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "PokerKit==0.7.5",
  "pydantic==2.11.5",
  "aiosqlite==0.21.0",
  "alembic==1.16.1",
  "asyncpg==0.30.0",
  "cryptography==45.0.2",
  "fastapi==0.115.12",
  "pydantic-settings==2.9.1",
  "python-socketio==5.13.0",
  "sqlalchemy==2.0.41",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "hypothesis==6.131.30",
  "mypy==1.15.0",
  "pytest==8.4.2",
  "pytest-asyncio==1.0.0",
  "ruff==0.11.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
